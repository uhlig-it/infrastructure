---
# Source: github.com/uhlig-it/www
# The Zola build stays in the app repo's CI; this playbook only configures the
# server. The built content is rsynced to /var/www/uhlig.it by the pipeline.
#
# familie-uhlig.net is the original domain of the blog. It serves no content of
# its own: both of its hostnames answer with a permanent (301) redirect to
# uhlig.it, so old links keep working while content and search signals stay on
# one domain. Its DNS lives at Hover, in a zone that also carries the iCloud
# MX/TXT records; this playbook does not touch those.
- name: Deploy uhlig.it
  hosts: neon
  become: true
  vars:
    domain: uhlig.it
    redirect_from:
      - familie-uhlig.net
      - www.familie-uhlig.net
  roles:
    - role: suhlig.caddy_file_server
      vars:
        caddy_domain: "{{ domain }}"
        caddy_content_directory: "/var/www/{{ domain }}"
        caddy_additional_config: |
          try_files {path}.html {path}
      tags: [caddy, static, files]
  tasks:
    - name: Caddy config for the familie-uhlig.net redirect is present
      ansible.builtin.copy:
        dest: /etc/caddy/familie-uhlig.net.caddy
        content: |
          # Managed by Ansible (playbooks/services/www.yml)
          {{ redirect_from | join(', ') }} {
            redir https://{{ domain }}{uri} permanent
          }
        owner: root
        group: root
        mode: "0644"
      notify: Caddy config for the redirect was reloaded
      tags: [caddy, redirect, http, files]
  handlers:
    - name: Caddy config for the redirect was reloaded
      ansible.builtin.command: caddy reload --config /etc/caddy/Caddyfile
      tags: [caddy, reload]
