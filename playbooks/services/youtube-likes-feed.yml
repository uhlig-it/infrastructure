---
# Source: github.com/uhlig-it/youtube-likes-feed
# CURRENTLY DEPLOYED NOWHERE — needs resurrection.
# The old host (wg) is retired and the inventory repo notes ytlf needs an
# update before the collection works again.
# Builds the binary from the app checkout (app_source) on the controller.
# Secrets (google_client_secret, ytlf_cookie_*, keys.ytlf.public_key) live in the vault.
- name: Deploy the YouTube Likes Feed
  hosts: unassigned
  become: true
  gather_facts: true
  vars:
    service_binary: "{{ app_source }}/youtube-likes-feed"
    ytlf_runtime_user: ytlf
    ytlf_database_path: "youtube-likes-feed/db"
    ytlf_info_json_path: "youtube-likes-feed/info_json"
  pre_tasks:
    - name: Program is up to date
      ansible.builtin.shell:
        cmd: GOOS=linux GOARCH=amd64 go build
        chdir: "{{ app_source }}"
      delegate_to: localhost
      become: false
  roles:
    - role: uhlig-it.simple_systemd_service
      become: true
      vars:
        program:
          name: youtube-likes-feed
          description: YouTube Likes Feed
          binary: "{{ service_binary }}"
          parameters:
            - "--external-url https://{{ ytlf_fqdn }}"
            - "--bind-address 127.0.0.1:{{ ytlf_port }}"
            - "--database-path {{ ytlf_database_path }}"
            - "--info-files {{ ytlf_info_json_path }}"
          environment:
            - "CLIENT_SECRET='{{ google_client_secret | tojson }}'"
            - COOKIE_SECRET="{{ ytlf_cookie_secret }}"
            - COOKIE_ENCRYPT="{{ ytlf_cookie_encrypt }}"
          runtime_user: "{{ ytlf_runtime_user }}"
      tags: [youtube, likes, feed, rss, atom, json, systemd, service]
    - role: suhlig.caddy_reverse_proxy
      become: true
      vars:
        caddy_domain: "{{ ytlf_fqdn }}"
        caddy_port: "{{ ytlf_port }}"
      tags: [youtube, likes, feed, rss, atom, json, caddy, proxy]
  post_tasks:
    - name: register runtime_user's details
      ansible.builtin.user:
        name: "{{ program.runtime_user }}"
        state: present
      register: runtime_user_registered
      tags: [ytlf, folders]
    - name: Folder for YTLF database and info-json files exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0770"
        owner: "{{ ytlf_runtime_user }}"
        group: "{{ ytlf_runtime_user }}"
      with_items:
        - "{{ runtime_user_registered.home }}/{{ ytlf_database_path }}"
        - "{{ runtime_user_registered.home }}/{{ ytlf_info_json_path }}"
      tags: [ytlf, folders]
    - name: runtime_user has authorized key
      ansible.posix.authorized_key:
        user: "{{ ytlf_runtime_user }}"
        state: present
        key: "{{ keys.ytlf.public_key }}"
      tags: [ytlf, ssh]
