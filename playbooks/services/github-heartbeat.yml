---
# The GitHub dependency heartbeat: a read-only GitHub client that reports the
# dependency-automation exceptions that need a human. It publishes one retained
# JSON verdict to the local broker; Home Assistant turns that into iOS
# notifications through roles/homeassistant/templates/packages/. It never talks
# to Home Assistant.
#
# Image: images/github-heartbeat/ in this repo, published as
# ghcr.io/uhlig-it/github-heartbeat by build-github-heartbeat.yml. The tag is
# pinned on purpose: watchtower must not change the component that watches
# everything else.
#
# Secrets: `vault_github_heartbeat_token` (group vars) and a
# `github-heartbeat` entry in `mosquitto_users` (in
# inventory/host_vars/opus/secrets.yml, where the broker users live). The broker passwd file is regenerated by the mosquitto
# role, so run playbooks/machines/opus.yml after adding the user. The script
# re-reads the token every cycle, so rotating the PAT means: update the vault,
# rerun this playbook.
#
# See docs/github-heartbeat.md.
- name: Deploy the GitHub dependency heartbeat
  hosts: opus
  become: true
  gather_facts: false
  vars:
    github_heartbeat_image: ghcr.io/uhlig-it/github-heartbeat:v0.1.0
    github_heartbeat_repos:
      - suhlig/rostfacto
      - suhlig/rustomato
      - suhlig/sqlite-vault
      - suhlig/euro-exchange-rates-resource
      - suhlig/concourse-resource-go
      - suhlig/fipe
      - suhlig/gosmos
      - suhlig/concourse-rss-resource
      - suhlig/httpspell
      - suhlig/pandoc-include-filter
      - suhlig/wordclock
      - suhlig/revealing
      - uhlig-it/kehrkraft
      - uhlig-it/shop-alarm
      - uhlig-it/shorts
      - uhlig-it/mqtt-gpio-binary-sensor
      - uhlig-it/mqtt-router
      - uhlig-it/mqtt-blink1
      - uhlig-it/speedtest-exporter
      - uhlig-it/tasmota-firmware-proxy
  tasks:
    - name: GitHub token is configured
      ansible.builtin.fail:
        msg: "Add vault_github_heartbeat_token to inventory/group_vars/all/secrets.yml."
      when: vault_github_heartbeat_token | default('') | length == 0
      tags: [ docker, github-heartbeat, container ]

    - name: MQTT credentials for the heartbeat are provisioned
      ansible.builtin.fail:
        msg: "Add a 'github-heartbeat' entry to mosquitto_users in inventory/host_vars/opus/secrets.yml, then rerun playbooks/machines/opus.yml so the broker passwd file is regenerated."
      when: mosquitto_users | default([]) | selectattr('name', 'equalto', 'github-heartbeat') | list | length == 0
      tags: [ docker, github-heartbeat, container ]

    - name: Heartbeat directory exists
      ansible.builtin.file:
        path: /opt/github-heartbeat
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: [ docker, github-heartbeat, directory ]

    - name: GitHub token is present
      ansible.builtin.copy:
        content: "{{ vault_github_heartbeat_token }}\n"
        dest: /opt/github-heartbeat/token
        owner: root
        # 65534 is `nogroup` on the host and `nobody` in the container; the
        # container runs as 65534:65534 and needs group read access. Keeping the
        # token out of /opt/homeassistant keeps it out of the B2 backups.
        group: "65534"
        mode: "0440"
      no_log: true
      tags: [ docker, github-heartbeat, config ]

    - name: Heartbeat is running
      community.docker.docker_container:
        name: github-heartbeat
        image: "{{ github_heartbeat_image }}"
        pull: true
        state: started
        detach: true
        restart: true
        restart_policy: always
        network_mode: host # localhost:1883 (mosquitto)
        env:
          GITHUB_TOKEN_FILE: /run/secrets/github-token
          REPOS: "{{ github_heartbeat_repos | join(',') }}"
          INTERVAL_SECONDS: "1800"
          STUCK_DAYS: "7"
          SILENT_DAYS: "21"
          MQTT_HOST: "127.0.0.1"
          MQTT_PORT: "1883"
          MQTT_USER: github-heartbeat
          MQTT_PASSWORD: "{{ mosquitto_users | selectattr('name', 'equalto', 'github-heartbeat') | map(attribute='password') | first }}"
          MQTT_BASE_TOPIC: github/heartbeat
        volumes:
          - /opt/github-heartbeat/token:/run/secrets/github-token:ro
      tags: [ docker, github-heartbeat, container ]
