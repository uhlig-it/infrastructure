---
# Runs the whole fleet: fleet concerns, then machines, then services.
# During migration, prefer running the narrower playbooks individually.
#
# neon's baseline, and the speisehof.de / nowak-reisen.de services, moved to
# nowak-reisen/infrastructure. neon stays in the inventory because uhlig.it,
# kehrkraft and uhlig.social still run there.
- import_playbook: fleet/deploy_key.yml
- import_playbook: fleet/tailscale.yml
- import_playbook: fleet/metrics.yml

- import_playbook: machines/pi5.yml
- import_playbook: machines/pi0.yml
- import_playbook: machines/kunakam.yml
- import_playbook: machines/ha-kiosk.yml
- import_playbook: machines/fortress.yml
- import_playbook: machines/opus.yml
- import_playbook: machines/pascal.yml
- import_playbook: machines/shop.yml
- import_playbook: machines/wordclock.yml
- import_playbook: machines/soda.yml

- import_playbook: services/kehrkraft.yml
- import_playbook: services/gotosocial.yml
- import_playbook: services/concourse.yml
- import_playbook: services/mosquitto-exporter.yml
- import_playbook: services/mqtt-router.yml
- import_playbook: services/mqtt-blink1.yml
- import_playbook: services/mqtt-gpio-binary-sensor.yml
- import_playbook: services/env-sensors.yml
- import_playbook: services/shop-alarm.yml
- import_playbook: services/tasmota-firmware-proxy.yml
- import_playbook: services/speedtest-exporter.yml
- import_playbook: services/shorts.yml
- import_playbook: services/www.yml
