---
# Source: github.com/uhlig-it/kunakam
# Tailscale is configured by playbooks/fleet/tailscale.yml.
# Camera variables live in inventory/host_vars/kunakam.yml.
# The Frigate NVR play lives in playbooks/machines/opus.yml — it runs on opus.
- name: kunakam camera
  hosts: cameras
  roles:
    - role: suhlig.foundation.main
      become: true
      tags: [suhlig]
    - role: suhlig.foundation.raspberry_pi
      become: true
      tags: [suhlig, raspi, raspberry, pi]
    - role: suhlig.foundation.mediamtx
      become: true
      tags: [mediamtx]
