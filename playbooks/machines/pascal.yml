---
# Migrated from github.com/uhlig-it/pascal (archived 2026-10-14).
# Tailscale is configured by playbooks/fleet/tailscale.yml.
# OctoPrint is published as a Tailscale Service (svc:octoprint) via the
# `octoprint` role; the old haproxy + manual tailscale cert are gone, and the
# github3.py / is-tls-expiring machinery went with them.
- name: pascal 3D printer server
  hosts: pascal
  collections:
    - thorian93.main
    - suhlig.foundation
  roles:
    - role: thorian93.main.upgrade
      become: true
    - role: thorian93.main.journald
      become: true
    - role: thorian93.main.common
      vars:
        common_configure_timezone: true
        common_timezone: "{{ timezone }}"
      become: true
    - role: thorian93.main.ntp
      become: true
    - role: suhlig.foundation.main
      become: true
    - role: octoprint
      become: true
      tags: [ octoprint, proxy ]
    - role: go2rtc
      become: true
      tags: [ go2rtc ]
    # shop-health probes the workshop Pi from pascal (same 192.168.1.0/24 LAN)
    # and records reachability as a node_exporter textfile metric.
    - role: shop-health
      become: true
      tags: [ shop-health ]
