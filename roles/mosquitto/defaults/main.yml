---
# Availability guard for stale retained LWT topics after broker restarts.
#
# Frigate and shop-alarm publish their availability as retained LWT topics;
# on connection loss the broker stores 'offline'. Frigate never republishes
# on reconnect, and a bridging broker replaying stale retained messages can
# clobber even topics whose owner did republish (incidents 2026-09-22:
# "Werkstatt Cam unavailable", alarm panel unavailable). The guard below
# republishes the retained 'online' for each topic, but only while that
# topic's owner actually answers its health probe — a genuinely dead service
# must still read 'offline'.

# Broker user that owns the guarded topics (must exist in mosquitto_users).
mosquitto_stale_lwt_user: frigate
# Topics to republish as retained 'online', each with the probe that must
# answer 200 before the republish happens.
mosquitto_lwt_guards:
  - topic: frigate/available
    probe: http://localhost:5000/api/version
  - topic: werkstatt/alarm/available
    probe: http://localhost:9101/healthz
  # Tasmota plugs have the same failure shape after an OTA: the old and new
  # firmware share a client ID, session takeover republishes the old will, and
  # the retained 'Offline' survives even though the plug is connected. The web
  # UI probe uses the same Basic-auth credential as the VictoriaMetrics scrape;
  # a genuinely dead plug fails the probe and keeps its retained 'Offline'.
  # Tasmota's discovery config advertises 'Online' (capital O) and Home
  # Assistant compares it literally, so these entries must not reuse the
  # lowercase message used by the other guards.
  - topic: home/nousA8T-0/tele/LWT
    probe: http://192.168.10.5/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-1/tele/LWT
    probe: http://192.168.10.6/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-2/tele/LWT
    probe: http://192.168.10.7/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-3/tele/LWT
    probe: http://192.168.10.8/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-4/tele/LWT
    probe: http://192.168.10.9/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-5/tele/LWT
    probe: http://192.168.10.10/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-6/tele/LWT
    probe: http://192.168.10.11/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
  - topic: home/nousA8T-7/tele/LWT
    probe: http://192.168.10.12/cm?cmnd=Status%2011
    probe_auth: "admin:{{ gosund_metrics_password }}"
    message: Online
