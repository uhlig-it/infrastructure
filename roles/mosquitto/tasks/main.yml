- name: Directories exist
  ansible.builtin.file:
    path: /opt/mosquitto/{{ item.path }}
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  loop:
    - { path: config, owner: suhlig }
    - { path: log, owner: suhlig }
    # The broker container (uid 1883) writes its persistence database here.
    - { path: data, owner: "1883" }
  become: true
  tags: [ docker, mosquitto, mqtt, directory ]
- name: Password file exists # needs to exist for bootstrapping
  file:
    path: /opt/mosquitto/config/passwd
    state: touch
    owner: suhlig
    group: suhlig
  become: true
- name: Password file is up to date
  community.docker.docker_container:
    name: generate-mosquitto-passwd-file
    image: eclipse-mosquitto
    command: "mosquitto_passwd -b /mosquitto/config/passwd {{ item.name | quote }} {{ item.password | quote }}"
    detach: true
    volumes: [ /opt/mosquitto/config:/mosquitto/config ]
  loop: "{{ mosquitto_users }}"
  no_log: true # the command line carries each user's password
  tags: [ docker, mosquitto, mqtt, passwd, file ]
- name: Config is rendered # may embed bridge passwords, hence no_log
  template:
    src: templates/mosquitto.conf
    dest: /opt/mosquitto/config/mosquitto.conf
  become: true
  no_log: true
  tags: [ config, mosquitto, mqtt ]
- name: Service is running
  community.docker.docker_container:
    name: mosquitto
    image: eclipse-mosquitto
    pull: true
    state: started
    detach: true
    restart: true
    restart_policy: always
    network_mode: host
    volumes:
      - /opt/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /opt/mosquitto/config/passwd:/mosquitto/config/passwd
      - /opt/mosquitto/data:/mosquitto/data
      - /opt/mosquitto/log:/mosquitto/log
  tags: [ docker, mosquitto, mqtt ]
- name: Legacy frigate-only availability guard cron is removed
  ansible.builtin.cron:
    name: frigate availability guard
    user: root
    state: absent
  become: true
  tags: [ docker, mosquitto, mqtt, cron ]
- name: Legacy frigate-only availability guard script is removed
  ansible.builtin.file:
    path: /opt/mosquitto/frigate-availability.sh
    state: absent
  become: true
  tags: [ docker, mosquitto, mqtt ]
- name: Availability guard script is rendered
  template:
    src: templates/availability-guard.sh.j2
    dest: /opt/mosquitto/availability-guard.sh
    mode: "0700"
    owner: root
    group: root
  become: true
  tags: [ docker, mosquitto, mqtt ]
- name: Availability guard is run right after the broker (re)start
  ansible.builtin.command: /opt/mosquitto/availability-guard.sh
  become: true
  register: mosquitto_availability_guard_run
  retries: 6
  delay: 3
  until: mosquitto_availability_guard_run.rc == 0 # broker may still be starting
  when: mosquitto_stale_lwt_user in (mosquitto_users | map(attribute='name'))
  tags: [ docker, mosquitto, mqtt ]
- name: Availability guard runs every two minutes
  ansible.builtin.cron:
    name: mqtt availability guard
    user: root
    minute: "*/2"
    job: /opt/mosquitto/availability-guard.sh
  become: true
  tags: [ docker, mosquitto, mqtt, cron ]
