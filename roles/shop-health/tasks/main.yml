---
# shop-health: the external sentinel that probes the workshop Pi (shop) and
# records its reachability as a node_exporter textfile metric. It runs on
# pascal (same LAN as shop). Migrated from the retired github.com/uhlig-it/shop
# (monitor/shop-health.sh) and github.com/uhlig-it/pascal (unit files).
- name: shop-health probe script is present
  ansible.builtin.copy:
    src: shop-health.sh
    dest: /usr/local/sbin/shop-health.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [ shop-health ]
- name: shop-health units are installed
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - shop-health.service
    - shop-health.timer
  become: true
  tags: [ shop-health ]
- name: shop-health timer is enabled and running
  ansible.builtin.systemd:
    name: shop-health.timer
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: [ shop-health ]
