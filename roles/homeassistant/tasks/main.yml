- name: Home Assistant directory exists
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}"
    state: directory
    owner: suhlig
    group: suhlig
  become: true
  tags: [ docker, homeassistant, directory ]
- name: Packages directory exists
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}/packages"
    state: directory
    owner: suhlig
    group: suhlig
  become: true
  tags: [ docker, homeassistant, config ]
# App-owned packages (shop-alarm, esp32-mic-node, github-heartbeat) are
# installed by their service playbooks from the app checkout; this role owns HA
# itself.
- name: Home Assistant loads its packages directory
  ansible.builtin.lineinfile:
    path: "{{ homeassistant_config_dir }}/configuration.yaml"
    regexp: '^  packages:'
    line: '  packages: !include_dir_named packages'
    insertafter: '^homeassistant:'
  become: true
  tags: [ docker, homeassistant, config ]
- name: Home Assistant is running
  community.docker.docker_container:
    name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    pull: true
    state: started
    detach: true
    privileged: true
    restart: true
    restart_policy: always
    env: { TZ: Europe/Berlin }
    network_mode: host
    volumes: [ /opt/homeassistant:/config ]
  tags: [ docker, homeassistant, container ]
