## VictoriaMetrics ------------------------------------------------------------

# Version of VictoriaMetrics single-node to install.
# Release asset: victoria-metrics-linux-amd64-v<version>.tar.gz
victoriametrics_version: 1.150.0
# sha256 of the release asset; update together with victoriametrics_version
# (taken from the *_checksums.txt file attached to the release).
victoriametrics_checksum: sha256:22bfe77be3de1ad03f214a005129312536d77ed4e293b66c186df417ee40a61d

victoriametrics_binary_path: /usr/local/bin/victoria-metrics-prod
victoriametrics_config_dir: /etc/victoria-metrics
victoriametrics_dashboards_dir: "{{ victoriametrics_config_dir }}/dashboards"

# Must match StateDirectory= in the systemd unit
# (StateDirectory=victoria-metrics creates /var/lib/victoria-metrics).
victoriametrics_storage_path: /var/lib/victoria-metrics

# Retention in months when no unit is given (Prometheus-style suffixes work too).
victoriametrics_retention_period: 12

# Bound to loopback only: the sole ingress path is tailscaled
# (device-level "tailscale serve" or the Tailscale Service below).
victoriametrics_http_listen_addr: 127.0.0.1:8428
victoriametrics_self_scrape_interval: 10s
victoriametrics_scrape_interval: 30s

## Memory budget ---------------------------------------------------------------

# Absolute cache budget. On a shared box the default -memory.allowedPercent=60
# let the caches grow to ~4.5 GiB and starve Concourse and Postgres (soda OOM
# incident, 2026-10-03). An absolute value cannot silently scale back up on a
# small host the way the percentage default did; 1.2 GB of data and seven
# scrape jobs do not need a multi-gigabyte cache.
victoriametrics_memory_allowed_bytes: 1500MB

# cgroup ceiling so a spike is reclaimed inside the unit instead of triggering
# a host-wide OOM kill that also takes down Concourse.
victoriametrics_memory_high: 1400M
victoriametrics_memory_max: 1800M

# The previous default RestartUSec=100ms re-warmed the caches immediately and
# fed the OOM loop; give the host time to recover between restarts.
victoriametrics_restart_sec: 10

## Basic auth ------------------------------------------------------------------

# HTTP endpoints incl. vmui; leave the password empty to disable auth.
# Reuses the same vault var as the old Prometheus web config.
victoriametrics_http_auth_username: suhlig
victoriametrics_http_auth_password: "{{ prometheus_password_suhlig | default('') }}"

## Tailscale Service ------------------------------------------------------------

# Published via the shared suhlig.foundation.tailscale_service role
# (see playbook.yml); the Service name must match a Service defined in the
# admin console. Set to false to skip the Tailscale role.
victoriametrics_tailscale_service: true
victoriametrics_tailscale_service_name: svc:metrics
victoriametrics_tailscale_service_port: 443

## Scrape target secrets --------------------------------------------------------

# Sourced from the same vault vars as before.
victoriametrics_node_exporter_password: "{{ node_exporter_password | default('') }}"
victoriametrics_gotosocial_password: "{{ gotosocial_metrics_password | default('') }}"
victoriametrics_watchtower_token: "{{ watchtower_bearer_token | default('') }}"
victoriametrics_gosund_password: "{{ gosund_metrics_password | default('') }}"
