name: Build github-heartbeat image

# The image is versioned independently of the infrastructure tree: push a
# `github-heartbeat-vX.Y.Z` tag to publish, then bump `github_heartbeat_image`
# in playbooks/services/github-heartbeat.yml to deploy. `latest` is never
# published on purpose: watchtower must not change the component that watches
# everything else without review.
on:
  push:
    tags: ["github-heartbeat-v*"]
  pull_request:
    paths:
      - images/github-heartbeat/**
      - .github/workflows/build-github-heartbeat.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Classifier tests
        run: bash images/github-heartbeat/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          tags="ghcr.io/uhlig-it/github-heartbeat:sha-${GITHUB_SHA:0:12}"
          if [[ $GITHUB_REF == refs/tags/github-heartbeat-v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/uhlig-it/github-heartbeat:${GITHUB_REF_NAME#github-heartbeat-}"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/github-heartbeat
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
