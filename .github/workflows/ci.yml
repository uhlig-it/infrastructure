name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Install Ansible
        run: |
          python3 -m venv /tmp/ansible
          /tmp/ansible/bin/pip install ansible-core
      - name: Install collections and roles
        run: |
          /tmp/ansible/bin/ansible-galaxy collection install -r requirements.yml
          /tmp/ansible/bin/ansible-galaxy role install -r requirements.yml
      - name: Syntax check every playbook
        # site.yml is a pure import list.
        run: |
          set -e
          for pb in $(find playbooks -name '*.yml' ! -name 'site.yml'); do
            echo "== $pb"
            /tmp/ansible/bin/ansible-playbook --syntax-check "$pb"
          done
