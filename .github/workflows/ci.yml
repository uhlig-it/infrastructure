name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Install Ansible
        run: |
          python3 -m venv /tmp/ansible
          /tmp/ansible/bin/pip install ansible-core
      - name: Install collections and roles
        env:
          # Never wait for a credential prompt in CI.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          install() {
            timeout 600 /tmp/ansible/bin/ansible-galaxy collection install -r requirements.yml || return 1
            timeout 600 /tmp/ansible/bin/ansible-galaxy role install -r requirements.yml || return 1
          }
          for attempt in 1 2; do
            echo "Attempt $attempt"
            if install; then
              exit 0
            fi
            echo "galaxy install failed; retrying" >&2
            sleep 15
          done
          exit 1
      - name: Syntax check every playbook
        # site.yml is a pure import list; playbooks/services/files/ holds
        # config files, not playbooks.
        run: |
          set -e
          for pb in $(find playbooks -name '*.yml' ! -name 'site.yml' ! -path 'playbooks/services/files/*'); do
            echo "== $pb"
            /tmp/ansible/bin/ansible-playbook --syntax-check "$pb"
          done
