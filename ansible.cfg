[defaults]
inventory = inventory/hosts.yml
# External roles install into ~/.ansible/roles; roles/ holds only the local
# roles tracked in this repo.
roles_path = ~/.ansible/roles:roles
collections_path = ~/.ansible/collections
deprecation_warnings = false
interpreter_python = /usr/bin/python3
stdout_callback = ansible.builtin.default
callback_result_format = yaml
bin_ansible_callbacks = True
# The vault password is read from the file named by $ANSIBLE_VAULT_PASSWORD_FILE
# (set by CI). Locally, export it or uncomment the line below:
# vault_password_file = .vault-password
