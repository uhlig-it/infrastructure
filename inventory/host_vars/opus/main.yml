---
ansible_user: suhlig

# Home server: subnet router for the 192.168.10.0/24 LAN and the tailnet exit node.
tailscale_args: --advertise-routes=192.168.10.0/24 --advertise-exit-node --accept-dns=true --accept-routes --operator=suhlig

# Tailscale Services published from this host.
tailscale_services:
  - name: svc:ha
    port: 443
    backend: http://localhost:8123
  - name: svc:unifi
    port: 443
    backend: https+insecure://localhost:8443
  - name: svc:status
    port: 443
    backend: http://localhost:3001

# Frigate: camera sources and the (non-secret) audio wiring live here in
# plaintext; only the MQTT password and the node's RTSP/HTTP passwords are vaulted.
frigate:
  mqtt:
    host: "100.102.100.41"
    user: "frigate"
    password: "{{ vault_frigate_mqtt_password }}"
  cameras:
    werkstatt:
      source: "ffmpeg:rtsp://shop.tailnet-204f.ts.net:8554/cam"
    printer:
      source: "rtsp://pascal.tailnet-204f.ts.net:8554/printer"
    living_room: # INMP441 node at home (audio only; no camera)
      mic: "rtsp://frigate:{{ vault_mic_rtsp_password }}@192.168.10.40:554/"
      # Frigate decodes a stream for every camera; the node has no camera, so it
      # serves a fixed 640x480 test card (~1 fps) as the decode/detect input.
      video: "http://monitor:{{ vault_mic_http_password }}@192.168.10.40/dummy.mjpg"
      audio_only: true
